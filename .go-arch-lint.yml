version: 3
workdir: .

allow:
  depOnAnyVendor: true
  # deepScan checks type flows across DI boundaries — false positives in composition roots (cmd/)
  deepScan: false

excludeFiles:
  - "^.*_test\\.go$"

# ── Components ────────────────────────────────────────────────────────────────
#
# Структура internal/:
#   internal/config/       — конфигурация приложения (общий слой)
#   internal/pkg/          — переиспользуемые внутренние пакеты
#   internal/app/          — прикладной код: хендлеры, воркеры, миграции
#
# Layer 0 — Foundation (нет зависимостей на внутренние пакеты)
#   internal/config
#   internal/pkg/domain
#   internal/pkg/platform/{logger,metrics,tracing}
#
# Layer 1 — Infrastructure (зависит только от Foundation)
#   internal/pkg/idempotency
#   internal/pkg/storage/{postgres,clickhouse}
#   internal/pkg/analytics
#   internal/pkg/messaging
#   internal/pkg/outbound/{httpclient,notifier}
#
# Layer 2 — Application (зависит от Foundation + Infrastructure)
#   internal/app/server/{handler,middleware}
#   internal/app/processor
#
# Bootstrap (internal/app/service, internal/app/migrate) — собирают всё вместе,
# вызываются из cmd/; зависимости не ограничены.
#
# Entrypoints (cmd/*) — точки входа, ограничения не применяются.

components:

  # Layer 0 — Foundation
  Domain:
    in: internal/pkg/domain
  Config:
    in: internal/config
  Metrics:
    in: internal/pkg/platform/metrics
  Logger:
    in: internal/pkg/platform/logger
  Tracing:
    in: internal/pkg/platform/tracing

  # Layer 1 — Infrastructure (internal/pkg/)
  Idempotency:
    in: internal/pkg/idempotency
  PostgresStorage:
    in: internal/pkg/storage/postgres
  ClickHouseStorage:
    in: internal/pkg/storage/clickhouse
  Analytics:
    in: internal/pkg/analytics
  Messaging:
    in: internal/pkg/messaging
  HTTPClient:
    in: internal/pkg/outbound/httpclient
  Notifier:
    in: internal/pkg/outbound/notifier

  # Layer 2 — Application (internal/app/)
  Middleware:
    in: internal/app/server/middleware
  Handler:
    in: internal/app/server/handler
  Processor:
    in: internal/app/processor

  # Bootstrap — собирают зависимости и запускают приложение; вызываются из cmd/
  Service:
    in: internal/app/service
  Migrate:
    in: internal/app/migrate

  # Entrypoints — только точки входа, без ограничений на зависимости
  ServerCmd:
    in: cmd/server
  WorkerCmd:
    in: cmd/worker
  MigrateCmd:
    in: cmd/migrate

  # Auto-generated swagger docs
  SwaggerDocs:
    in: docs/swagger

# ── Dependency rules ──────────────────────────────────────────────────────────
deps:

  # Layer 0 — Foundation: внутренних зависимостей нет
  Domain:
    anyVendorDeps: true
  Config:
    anyVendorDeps: true
  Metrics:
    anyVendorDeps: true
  Logger:
    anyVendorDeps: true
  Tracing:
    anyVendorDeps: true

  # Layer 1 — Infrastructure (internal/pkg/)
  Idempotency:
    mayDependOn:
      - Domain

  PostgresStorage:
    mayDependOn:
      - Domain
      - Idempotency
      - Logger
      - Tracing

  ClickHouseStorage:
    mayDependOn:
      - Domain
      - Analytics
      - Logger
      - Tracing

  Analytics:
    mayDependOn:
      - Domain

  Messaging:
    mayDependOn:
      - Logger
      - Tracing

  HTTPClient:
    mayDependOn:
      - Metrics
      - Logger
      - Tracing

  Notifier:
    mayDependOn:
      - HTTPClient
      - Logger

  # Layer 2 — Application (internal/app/)
  Middleware:
    mayDependOn:
      - Logger
      - Tracing
      - Metrics

  Handler:
    mayDependOn:
      - Domain
      - Idempotency
      - Analytics
      - Metrics
      - Logger
      - Tracing

  Processor:
    mayDependOn:
      - Domain
      - Analytics
      - Messaging
      - Metrics
      - Logger
      - Tracing

  # Bootstrap + Entrypoints: зависимости не ограничены
  Service:
    anyProjectDeps: true
    anyVendorDeps: true
  Migrate:
    anyProjectDeps: true
    anyVendorDeps: true
  SwaggerDocs:
    anyProjectDeps: true
    anyVendorDeps: true
  MigrateCmd:
    anyProjectDeps: true
    anyVendorDeps: true
  ServerCmd:
    anyProjectDeps: true
    anyVendorDeps: true
  WorkerCmd:
    anyProjectDeps: true
    anyVendorDeps: true

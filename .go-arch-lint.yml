version: 3
workdir: .

allow:
  depOnAnyVendor: true
  # deepScan checks type flows across DI boundaries — false positives in composition roots (cmd/)
  deepScan: false

excludeFiles:
  - "^.*_test\\.go$"

# ── Components ────────────────────────────────────────────────────────────────
#
# Layer 0 — Foundation (no internal deps)
#   pkg/domain, config, pkg/platform/*
#
# Layer 1 — Infrastructure (depends only on Foundation)
#   pkg/idempotency, pkg/storage/*, pkg/analytics, pkg/messaging, pkg/outbound/*
#
# Layer 2 — Application (depends on Foundation + Infrastructure)
#   app/server/handler, app/server/middleware, app/processor
#
# Entrypoints (cmd/*) wire everything and are excluded from checks.

components:

  # Layer 0 — Foundation
  Domain:
    in: internal/pkg/domain
  Config:
    in: internal/config
  Metrics:
    in: internal/pkg/platform/metrics
  Logger:
    in: internal/pkg/platform/logger
  Tracing:
    in: internal/pkg/platform/tracing

  # Layer 1 — Infrastructure
  Idempotency:
    in: internal/pkg/idempotency
  PostgresStorage:
    in: internal/pkg/storage/postgres
  ClickHouseStorage:
    in: internal/pkg/storage/clickhouse
  Analytics:
    in: internal/pkg/analytics
  Messaging:
    in: internal/pkg/messaging
  HTTPClient:
    in: internal/pkg/outbound/httpclient
  Notifier:
    in: internal/pkg/outbound/notifier

  # Auto-generated swagger docs
  SwaggerDocs:
    in: docs/swagger

  # Bootstrap — wires all dependencies; thin wrapper called from cmd/
  Service:
    in: internal/app/service
  Migrate:
    in: internal/app/migrate

  # Entrypoints — wire everything, no restrictions
  ServerCmd:
    in: cmd/server
  WorkerCmd:
    in: cmd/worker
  MigrateCmd:
    in: cmd/migrate

  # Layer 2 — Application
  Middleware:
    in: internal/app/server/middleware
  Handler:
    in: internal/app/server/handler
  Processor:
    in: internal/app/processor

# ── Dependency rules ──────────────────────────────────────────────────────────
deps:

  # Foundation: no internal deps (vendor deps allowed via anyVendorDeps)
  Domain:
    anyVendorDeps: true
  Config:
    anyVendorDeps: true
  Metrics:
    anyVendorDeps: true
  Logger:
    anyVendorDeps: true
  Tracing:
    anyVendorDeps: true

  # Layer 1
  Idempotency:
    mayDependOn:
      - Domain

  PostgresStorage:
    mayDependOn:
      - Domain
      - Idempotency
      - Logger
      - Tracing

  ClickHouseStorage:
    mayDependOn:
      - Domain
      - Analytics
      - Logger
      - Tracing

  Analytics:
    mayDependOn:
      - Domain

  Messaging:
    mayDependOn:
      - Logger
      - Tracing

  HTTPClient:
    mayDependOn:
      - Metrics
      - Logger
      - Tracing

  Notifier:
    mayDependOn:
      - HTTPClient
      - Logger

  # Layer 2
  Middleware:
    mayDependOn:
      - Logger
      - Tracing
      - Metrics

  Handler:
    mayDependOn:
      - Domain
      - Idempotency
      - Analytics
      - Metrics
      - Logger
      - Tracing

  Processor:
    mayDependOn:
      - Domain
      - Analytics
      - Messaging
      - Metrics
      - Logger
      - Tracing

  # Bootstrap + Entrypoints: allowed to depend on everything
  Service:
    anyProjectDeps: true
    anyVendorDeps: true
  Migrate:
    anyProjectDeps: true
    anyVendorDeps: true
  SwaggerDocs:
    anyProjectDeps: true
    anyVendorDeps: true
  MigrateCmd:
    anyProjectDeps: true
    anyVendorDeps: true
  ServerCmd:
    anyProjectDeps: true
    anyVendorDeps: true
  WorkerCmd:
    anyProjectDeps: true
    anyVendorDeps: true

version: "3"

vars:
  BINARY_SERVER: bin/server
  BINARY_WORKER: bin/worker
  MODULE: github.com/leenwood/event-observability-platform
  GOFLAGS: -trimpath

tasks:

  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  # ── Build ──────────────────────────────────────────────────────────────────

  build:
    desc: Build all binaries (server, worker, migrate)
    deps: [build:server, build:worker, build:migrate]

  build:server:
    desc: Build server binary → bin/server
    cmds:
      - go build {{.GOFLAGS}} -o {{.BINARY_SERVER}} ./cmd/server

  build:worker:
    desc: Build worker binary → bin/worker
    cmds:
      - go build {{.GOFLAGS}} -o {{.BINARY_WORKER}} ./cmd/worker

  build:migrate:
    desc: Build migrate binary → bin/migrate
    cmds:
      - go build {{.GOFLAGS}} -o bin/migrate ./cmd/migrate

  # ── Run ───────────────────────────────────────────────────────────────────

  run:
    desc: Run HTTP server locally (reads .env)
    cmds:
      - go run ./cmd/server

  run:worker:
    desc: Run async event worker locally (reads .env)
    cmds:
      - go run ./cmd/worker

  # ── Test ──────────────────────────────────────────────────────────────────

  test:
    desc: Run unit tests with race detector
    cmds:
      - go test -race -count=1 -timeout=60s ./...

  test:integration:
    desc: Run integration tests against real containers (requires Docker)
    cmds:
      - go test -race -count=1 -timeout=120s -tags=integration ./...

  test:cover:
    desc: Run tests and produce HTML coverage report (coverage.html)
    cmds:
      - go test -race -count=1 -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report written to coverage.html"

  # ── Code quality ──────────────────────────────────────────────────────────

  lint:
    desc: Run golangci-lint against all packages
    cmds:
      - go tool golangci-lint run ./...

  arch:
    desc: Check architectural dependency rules (.go-arch-lint.yml)
    cmds:
      - go tool go-arch-lint check

  fmt:
    desc: Format all Go source files with gofmt and goimports
    cmds:
      - go fmt ./...
      - goimports -w .

  vet:
    desc: Run go vet against all packages
    cmds:
      - go vet ./...

  # ── Docker ────────────────────────────────────────────────────────────────

  docker:up:
    desc: Start infrastructure containers (postgres, clickhouse, redpanda, prometheus, grafana)
    cmds:
      - docker compose up -d postgres clickhouse redpanda redpanda-init prometheus grafana

  docker:down:
    desc: Stop all containers
    cmds:
      - docker compose down

  docker:reset:
    desc: Stop containers and wipe all volumes (destructive)
    cmds:
      - docker compose down -v

  docker:logs:
    desc: Stream logs from all running containers
    cmds:
      - docker compose logs -f

  # ── Migrations ────────────────────────────────────────────────────────────

  migrate:up:
    desc: Apply all pending PostgreSQL and ClickHouse migrations
    cmds:
      - go run ./cmd/migrate -target=postgres up
      - go run ./cmd/migrate -target=clickhouse up

  migrate:down:
    desc: Rollback the last PostgreSQL migration (use -target=clickhouse to target ClickHouse)
    cmds:
      - go run ./cmd/migrate -target=postgres down

  migrate:status:
    desc: Print migration status for both databases
    cmds:
      - echo "=== PostgreSQL ===" && go run ./cmd/migrate -target=postgres status
      - echo "=== ClickHouse ===" && go run ./cmd/migrate -target=clickhouse status

  migrate:create:
    desc: "Create a new goose migration. Usage: task migrate:create -- <name>"
    cmds:
      - |
        name="{{.CLI_ARGS}}"
        if [ -z "$name" ]; then
          echo "Error: migration name required. Usage: task migrate:create -- <name>" >&2
          exit 1
        fi
        go run ./cmd/migrate -target=postgres create "$name" sql
        echo "Tip: also create migrations/clickhouse/<version>_${name}.sql if needed"

  # ── Documentation ─────────────────────────────────────────────────────────

  docs:
    desc: "Regenerate Swagger docs (requires: go install github.com/swaggo/swag/cmd/swag@latest)"
    cmds:
      - swag init -g cmd/server/main.go -o docs/swagger --parseDependency --parseInternal

  # ── Dependencies ──────────────────────────────────────────────────────────

  deps:
    desc: Download and tidy Go module dependencies
    cmds:
      - go mod download
      - go mod tidy
